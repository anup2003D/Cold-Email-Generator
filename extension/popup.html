<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Email Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 450px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .container {
            background: white;
            margin: 0;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .content {
            padding: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #667eea;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 3px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 3px solid #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 3px solid #c62828;
        }

        .status.warning {
            background: #fff3e0;
            color: #f57c00;
            border-left: 3px solid #f57c00;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .email-preview {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .job-info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .job-info-item {
            margin-bottom: 8px;
        }

        .job-info-item strong {
            color: #667eea;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .resume-info {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .resume-info strong {
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #eee;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Cold Email Generator</h1>
            <p>AI-Powered Job Application Assistant</p>
        </div>

        <div class="content">
            <!-- Initial State -->
            <div id="initialState">
                <div class="status info" id="statusMessage">
                    Ready to generate cold emails!
                </div>
                
                <!-- Resume Section -->
                <div class="section">
                    <div class="section-title">📄 Your Resume</div>
                    <div id="resumeStatus" class="resume-info">
                        Checking resume status...
                    </div>
                    <input type="file" id="resumeFileInput" accept=".pdf">
                    <button class="btn-secondary file-upload-btn" id="uploadResumeBtn">
                        📤 Upload Resume (PDF)
                    </button>
                    <button class="btn-secondary hidden" id="changeResumeBtn">
                        🔄 Change Resume
                    </button>
                </div>
                
                <div class="section">
                    <button class="btn-primary" id="extractJobBtn">
                        Extract Job from Current Page
                    </button>
                    <!-- Gmail OAuth disabled - using SMTP instead -->
                    <button class="btn-secondary hidden" id="connectGmailBtn">
                        Connect Gmail Account
                    </button>
                </div>
            </div>

            <!-- Job Extracted State -->
            <div id="jobExtractedState" class="hidden">
                <div class="status success">
                    ✅ Job details extracted successfully!
                </div>

                <div class="section">
                    <div class="section-title">Job Details</div>
                    <div class="job-info" id="jobInfo"></div>
                </div>

                <div class="section">
                    <button class="btn-primary" id="generateEmailBtn">
                        Generate Cold Email
                    </button>
                </div>
            </div>

            <!-- Email Generated State -->
            <div id="emailGeneratedState" class="hidden">
                <div class="status success">
                    ✅ Email generated successfully!
                </div>

                <div class="section">
                    <div class="section-title">Generated Email</div>
                    <div class="email-preview" id="emailPreview"></div>
                </div>

                <div class="section">
                    <div class="section-title">Recipient Email</div>
                    <input type="email" id="recipientEmail" placeholder="hiring@company.com">
                </div>

                <div class="section">
                    <div class="action-buttons">
                        <button class="btn-secondary" id="editEmailBtn">
                            ✏️ Edit
                        </button>
                        <button class="btn-success" id="sendEmailBtn">
                            🚀 Send Email
                        </button>
                    </div>
                    <button class="btn-secondary" id="regenerateBtn">
                        🔄 Generate New Email
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="hidden">
                <div class="status info">
                    <span class="spinner"></span>
                    <span id="loadingMessage">Processing...</span>
                </div>
            </div>
        </div>

        <div class="footer">
            Made with ❤️ by Anup
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
